# dev 푸시에 대한 CI가 성공하면 운영 서버에 SSH로 접속해 scripts/deploy.sh를 실행한다.
# 아래 저장소 Secrets가 모두 등록되기 전까지는 배포 단계를 건너뛴다(실패로 표시하지 않음).
# Secrets가 있는데 값이 잘못됐거나 배포 스크립트가 실패하면 실패로 표시한다(#214).
#   DEPLOY_HOST         서버 주소
#   DEPLOY_USER         SSH 계정 (예: ubuntu)
#   DEPLOY_SSH_KEY      배포 전용 SSH 개인 키 (개인 키 재사용 금지)
#   DEPLOY_KNOWN_HOSTS  서버 호스트 키 (ssh-keyscan 결과). 중간자 공격을 막기 위해 고정한다
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 운영 서버 배포
    # 수동 실행이거나, dev 푸시로 실행된 CI가 성공했을 때만 배포한다 (PR CI는 제외)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Secrets 확인
        id: secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "배포 Secrets가 등록되지 않아 배포를 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # 키·known_hosts 값이 잘못되면 ssh가 인증 전에 끊겨 원인을 알기 어렵다(#214).
      # 여기서 먼저 검증해 어떤 Secret이 문제인지 로그에 남긴다. 비밀값 자체는 출력하지 않는다
      - name: SSH 설정
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # 웹에서 붙여넣을 때 섞일 수 있는 앞뒤 공백·줄바꿈만 지운다 (호스트 이름이 known_hosts와 달라지는 것을 막음)
          DEPLOY_HOST="${DEPLOY_HOST#"${DEPLOY_HOST%%[![:space:]]*}"}"
          DEPLOY_HOST="${DEPLOY_HOST%"${DEPLOY_HOST##*[![:space:]]}"}"
          # 주소 칸에 known_hosts 줄 등을 잘못 붙여넣으면 가운데에 공백·줄바꿈이 남는다. 값은 출력하지 않는다 (#230)
          if [[ "$DEPLOY_HOST" =~ [[:space:]] ]]; then
            echo "::error::DEPLOY_HOST에 공백이나 여러 줄이 들어 있습니다. 서버 주소(IP 또는 도메인) 한 줄만 등록해 주세요."
            exit 1
          fi
          # GitHub은 등록한 원래 값만 로그에서 가린다. 다듬은 값도 가리도록 따로 등록한다 (공개 저장소라 로그도 공개됨)
          echo "::add-mask::$DEPLOY_HOST"
          install -m 700 -d ~/.ssh
          # 줄 끝에 섞일 수 있는 CR(\r)을 지운다
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY를 SSH 개인 키로 읽을 수 없습니다. -----BEGIN OPENSSH PRIVATE KEY-----부터 -----END OPENSSH PRIVATE KEY-----까지 전체를 다시 등록해 주세요."
            exit 1
          fi
          echo "배포 키 지문: $(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')"

          if ! ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::DEPLOY_KNOWN_HOSTS에 DEPLOY_HOST 항목이 없습니다. 로컬에서 ssh-keyscan <DEPLOY_HOST 값> 결과를 다시 등록해 주세요."
            exit 1
          fi

      # 배포 스크립트가 실패하면 이 단계도 실패해야 한다. 기본 셸은 pipefail이 꺼져 있어
      # ssh가 실패해도 tee가 성공하면 단계가 성공으로 처리됐다(#214)
      - name: 배포 스크립트 실행
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -uo pipefail
          DEPLOY_HOST=$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')
          echo "::add-mask::$DEPLOY_HOST"
          echo "::add-mask::$DEPLOY_USER"
          # 서버에 등록된 배포 키는 배포 스크립트만 실행하도록 제한되어 있어, 요청한 명령 대신 항상 배포 스크립트가 실행된다
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash ~/FinTarget-BE/scripts/deploy.sh' 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          {
            if [ "$status" -eq 0 ]; then echo '### 배포 결과: 성공'; else echo "### 배포 결과: 실패 (종료 코드 $status)"; fi
            echo '```'
            tail -n 30 deploy.log
            echo '```'
            if [ "$status" -eq 255 ]; then
              echo 'SSH 접속 실패입니다. 위 로그의 원인(Permission denied, Host key verification failed, Connection timed out 등)을 확인해 주세요.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: SSH 키 삭제
        if: always()
        run: rm -f ~/.ssh/deploy_key

services:
  db:
    # pgvector 확장이 포함된 postgres 16 이미지 (#181). 데이터 형식이 postgres:16과 같아 기존 볼륨을 그대로 쓴다.
    # 기존 볼륨에는 init 스크립트가 돌지 않으므로 확장·테이블은 docs/sql/181_policy_chunk_embedding.sql을 직접 실행한다
    image: pgvector/pgvector:pg16
    container_name: fintarget-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fintarget}
      POSTGRES_USER: ${DB_USERNAME:-moon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    # 호스트(서버) 안에서만 접속 가능하도록 127.0.0.1에 바인딩. 앱은 Docker 네트워크의 서비스 이름(db)으로 접속한다
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-moon} -d ${DB_NAME:-fintarget}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: fintarget-redis
    restart: unless-stopped
    # 비밀번호가 없으므로 외부에 열지 않는다. 앱은 Docker 네트워크의 서비스 이름(redis)으로 접속한다
    ports:
      - "127.0.0.1:6379:6379"

  app:
    build: .
    container_name: fintarget-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # HTTPS(Caddy)로 옮긴 뒤에는 .env에 APP_BIND_ADDRESS=127.0.0.1을 넣어 8080을 외부에서 막는다 (#218).
    # 앱(iOS)이 아직 http://<IP>:8080을 쓰는 동안은 기본값(전체 공개)을 유지한다
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fintarget}
      DB_USERNAME: ${DB_USERNAME:-moon}
      DB_PASSWORD: ${DB_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 카카오 토큰의 발급 앱 확인용 앱 ID (#218). 카카오 개발자 콘솔 > 앱 설정 > 앱 키 화면의 "앱 ID"(숫자)
      KAKAO_APP_ID: ${KAKAO_APP_ID:-}
      JWT_SECRET: ${JWT_SECRET:-}
      YOUTH_CENTER_API_KEY: ${YOUTH_CENTER_API_KEY:-}
      YOUTH_CENTER_BASE_URL: ${YOUTH_CENTER_BASE_URL:-}
      KINFA_API_KEY: ${KINFA_API_KEY:-}
      KINFA_BASE_URL: ${KINFA_BASE_URL:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      BANK_WEBHOOK_KEY: ${BANK_WEBHOOK_KEY:-}
      SWAGGER_USERNAME: ${SWAGGER_USERNAME:-}
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD:-}
      JWT_REVOKE_USED_REFRESH_TOKEN: ${JWT_REVOKE_USED_REFRESH_TOKEN:-false}
      # Caddy가 붙인 X-Forwarded-* 헤더로 실제 클라이언트 IP·https 여부를 판단한다 (Docker 내부망 프록시만 신뢰)
      SERVER_FORWARD_HEADERS_STRATEGY: native
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL_DEFAULT: ${OPENAI_MODEL_DEFAULT:-}
      # 상위 모델 (#229 추천 리랭킹에만 사용). .env에 없거나 비어 있으면 gpt-6.1-sol (코드 기본값과 같음)
      OPENAI_MODEL_PREMIUM: ${OPENAI_MODEL_PREMIUM:-gpt-6.1-sol}
      # 추천 목록 LLM 리랭킹 (#229). .env에 없거나 비어 있으면 true. false면 LLM 없이 규칙 상위 N.
      # 바꾼 뒤 `docker compose up -d --no-deps app`으로 컨테이너를 다시 만들어야 반영된다
      POLICY_RECOMMEND_RERANK_ENABLED: ${POLICY_RECOMMEND_RERANK_ENABLED:-true}
      # 직접 등록 정책 추천 목록 고정 노출 (#245). .env에 없거나 비어 있으면 true. false면 고정 없이 기존 추천 결과 그대로
      POLICY_RECOMMEND_MANUAL_PIN_ENABLED: ${POLICY_RECOMMEND_MANUAL_PIN_ENABLED:-true}
      # 통합 답변·검색의 사용자별 하루 호출 수 (#239). 비우면 0 = 무제한(부스 시연). 다시 걸려면 .env에 20·50처럼 양수를 넣는다
      POLICY_RAG_DAILY_LIMIT: ${POLICY_RAG_DAILY_LIMIT:-0}
      POLICY_SEARCH_DAILY_LIMIT: ${POLICY_SEARCH_DAILY_LIMIT:-0}
      # 통합 답변 검색 문장 바꿔 쓰기 (#241). .env에 없거나 비어 있으면 true. false면 원래 질문으로만 검색한다 (#235 동작).
      # 바꾼 뒤 `docker compose up -d --no-deps app`으로 컨테이너를 다시 만들어야 반영된다
      POLICY_RAG_QUERY_REWRITE_ENABLED: ${POLICY_RAG_QUERY_REWRITE_ENABLED:-true}
      # 부스 시연용 계정 초기화 API (#239). 비우면 false이고, false면 초기화 API 3개가 모두 404다.
      # 시연 때만 .env에 true를 넣고 `docker compose up -d --no-deps app`으로 앱 컨테이너를 다시 만든다
      DEMO_RESET_ENABLED: ${DEMO_RESET_ENABLED:-false}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
      # 운영에서는 엔티티 변경으로 스키마가 자동으로 바뀌지 않도록 검증만 한다 (#219). 서버의 application.yml보다 우선한다.
      # 스키마 변경은 docs/sql/의 SQL을 배포 전에 직접 실행하고, 엔티티와 DB가 다르면 앱이 뜨지 않아 deploy.sh가 이전 버전으로 되돌린다
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      SPRING_JPA_SHOW_SQL: "false"

  # 시연용 가상 금융 서버 (#204). 브라우저에서 http://<서버 IP>:8081 로 접속하고 Basic Auth로 로그인한다.
  # 웹훅은 Docker 네트워크의 서비스 이름(app)으로 메인 서버에 바로 보내고, 키는 메인 서버와 같은 BANK_WEBHOOK_KEY를 쓴다.
  # 계정이 비어 있으면 앱이 시작되지 않으므로, scripts/deploy.sh는 .env에 계정이 없으면 이 서비스를 띄우지 않는다
  mock-bank:
    build: ./mock-bank
    container_name: fintarget-mock-bank
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    # HTTPS(https://bank.<도메인>)로 접속하게 되면 .env에 MOCK_BANK_BIND_ADDRESS=127.0.0.1을 넣어 8081을 외부에서 막는다 (#230)
    ports:
      - "${MOCK_BANK_BIND_ADDRESS:-0.0.0.0}:8081:8081"
    environment:
      # Caddy 뒤에서 https 주소로 리다이렉트하도록 X-Forwarded-* 헤더를 믿는다
      SERVER_FORWARD_HEADERS_STRATEGY: native
      MOCK_BANK_USERNAME: ${MOCK_BANK_USERNAME:-}
      MOCK_BANK_PASSWORD: ${MOCK_BANK_PASSWORD:-}
      FINTARGET_BASE_URL: http://app:8080
      FINTARGET_WEBHOOK_KEY: ${BANK_WEBHOOK_KEY:-}
    # 거래 기록(H2 파일 DB)을 재배포해도 유지한다
    volumes:
      - mock-bank-data:/app/data

  # HTTPS 리버스 프록시 (#218). .env에 DOMAIN이 있을 때만 scripts/deploy.sh가 https 프로필로 띄운다
  caddy:
    image: caddy:2.11.9
    container_name: fintarget-caddy
    restart: unless-stopped
    profiles: ["https"]
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서를 재시작·재배포해도 유지한다 (Let's Encrypt 발급 횟수 제한 회피)
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  mock-bank-data:
  caddy-data:
  caddy-config:

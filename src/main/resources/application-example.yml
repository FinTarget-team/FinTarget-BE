# 이 파일은 예시용 템플릿입니다. 실제 설정은 이 파일을 복사해
# application.yml로 저장한 뒤 값을 채워서 사용하세요 (application.yml은 .gitignore 대상입니다).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fintarget}
    username: ${DB_USERNAME:moon}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mvc:
    pathmatch:
      use-suffix-pattern: false
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: http://localhost:8080/login/oauth2/code/kakao
  client-secret: ${KAKAO_CLIENT_SECRET}
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
youthcenter:
  api:
    key: ${YOUTH_CENTER_API_KEY}
    base-url: ${YOUTH_CENTER_BASE_URL}
kinfa:
  api:
    key: ${KINFA_API_KEY}
    base-url: ${KINFA_BASE_URL}
# OpenAI (#114). 항목이 없어도 코드 기본값으로 기동되며, api-key가 비어 있으면 AI 기능만 비활성(호출 시 503)
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: https://api.openai.com/v1
  model:
    default: ${OPENAI_MODEL_DEFAULT:gpt-6-luna}
    premium: ${OPENAI_MODEL_PREMIUM:gpt-6.1-sol}
  reasoning-effort: low      # gpt-6.1-sol은 none, minimal 미지원
  max-output-tokens: 4000    # 추론 토큰 포함
  connect-timeout: 3s
  read-timeout: 30s
  total-timeout: 45s         # 첫 시도부터의 누적 시간 상한. 넘으면 재시도하지 않음
  max-retries: 2             # 429(호출 한도), 5xx, 연결 실패만 재시도
  retry-backoff: 1s

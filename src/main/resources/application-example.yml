# 이 파일은 예시용 템플릿입니다. 실제 설정은 이 파일을 복사해
# application.yml로 저장한 뒤 값을 채워서 사용하세요 (application.yml은 .gitignore 대상입니다).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fintarget}
    username: ${DB_USERNAME:moon}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mvc:
    pathmatch:
      use-suffix-pattern: false
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: http://localhost:8080/login/oauth2/code/kakao
  client-secret: ${KAKAO_CLIENT_SECRET}
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
youthcenter:
  api:
    key: ${YOUTH_CENTER_API_KEY}
    base-url: ${YOUTH_CENTER_BASE_URL}
kinfa:
  api:
    key: ${KINFA_API_KEY}
    base-url: ${KINFA_BASE_URL}
# OpenAI (#114). 항목이 없어도 코드 기본값으로 기동되며, api-key가 비어 있으면 AI 기능만 비활성(호출 시 503)
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: https://api.openai.com/v1
  model:
    default: ${OPENAI_MODEL_DEFAULT:gpt-6-luna}   # 정책 AI 질문(#125)은 항상 이 기본 등급 모델을 쓴다
    premium: ${OPENAI_MODEL_PREMIUM:gpt-6.1-sol}
  # 정책 청크 임베딩 모델 (#181). 1536차원 고정(policy_chunk_embedding.embedding). 바꾸면 다음 실행 때 전체 재임베딩
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  reasoning-effort: low      # gpt-6.1-sol은 none, minimal 미지원
  max-output-tokens: 4000    # 추론 토큰 포함
  connect-timeout: 3s
  read-timeout: 30s
  total-timeout: 45s         # 첫 시도부터의 누적 시간 상한. 넘으면 재시도하지 않음
  max-retries: 2             # 429(호출 한도), 5xx, 연결 실패만 재시도
  retry-backoff: 1s

# 정책 검색 (#182). 세 값 모두 검색 평가(#184) 결과로 확정한다
policy:
  search:
    k: 5                   # 돌려줄 정책 수. 통합 AI 답변(#183)이 프롬프트에 넣을 청크 수와 같다
    max-distance: 0.5      # 코사인 거리 하한. 이보다 멀면 무관한 결과로 보고 버린다 (0에 가까울수록 유사)
    chunk-multiplier: 3    # 조회할 청크 수 = k × 이 값. 한 정책이 청크 여러 개를 차지해도 k개를 채우기 위한 여유

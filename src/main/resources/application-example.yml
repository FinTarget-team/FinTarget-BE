# 이 파일은 예시용 템플릿입니다. 실제 설정은 이 파일을 복사해
# application.yml로 저장한 뒤 값을 채워서 사용하세요 (application.yml은 .gitignore 대상입니다).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fintarget}
    username: ${DB_USERNAME:moon}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update   # 로컬 개발용. 운영은 docker-compose.yml이 validate로 덮어쓴다 (#219)
    show-sql: false
  mvc:
    pathmatch:
      use-suffix-pattern: false
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
kakao:
  # 카카오 토큰의 발급 앱 확인용 앱 ID(숫자) (#218). 비우면 확인하지 않는다 (로컬 개발용)
  app-id: ${KAKAO_APP_ID:}
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
youthcenter:
  api:
    key: ${YOUTH_CENTER_API_KEY}
    base-url: ${YOUTH_CENTER_BASE_URL}
kinfa:
  api:
    key: ${KINFA_API_KEY}
    base-url: ${KINFA_BASE_URL}
# OpenAI (#114). 항목이 없어도 코드 기본값으로 기동되며, api-key가 비어 있으면 AI 기능만 비활성(호출 시 503)
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: https://api.openai.com/v1
  model:
    default: ${OPENAI_MODEL_DEFAULT:gpt-6-luna}   # 정책 AI 질문(#125)은 항상 이 기본 등급 모델을 쓴다
    premium: ${OPENAI_MODEL_PREMIUM:gpt-6.1-sol}
  # 정책 청크 임베딩 모델 (#181). 1536차원 고정(policy_chunk_embedding.embedding). 바꾸면 다음 실행 때 전체 재임베딩
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  reasoning-effort: low      # gpt-6.1-sol은 none, minimal 미지원
  max-output-tokens: 4000    # 추론 토큰 포함
  connect-timeout: 3s
  read-timeout: 30s
  total-timeout: 45s         # 첫 시도부터의 누적 시간 상한. 넘으면 재시도하지 않음
  max-retries: 2             # 429(호출 한도), 5xx, 연결 실패만 재시도
  retry-backoff: 1s

# 정책 검색 (#182). 세 값 모두 검색 평가(#184) 결과로 확정한다
policy:
  search:
    k: 5                   # 돌려줄 정책 수. 통합 AI 답변(#183)이 프롬프트에 넣을 청크 수와 같다
    max-distance: 0.65     # 코사인 거리 하한. 이보다 멀면 무관한 결과로 보고 버린다 (0에 가까울수록 유사)
    chunk-multiplier: 3    # 조회할 청크 수 = k × 이 값. 한 정책이 청크 여러 개를 차지해도 k개를 채우기 위한 여유
    daily-limit: 50        # 검색 API 사용자별 하루 호출 수 (#183, KST 자정 초기화). 통합 AI 답변 내부 검색은 세지 않는다
  # 통합 정책 AI 답변 (#183)
  rag:
    daily-limit: 20        # 사용자별 하루 질문 수 (KST 자정 초기화). AI 호출이 실패한 요청은 되돌린다
    max-output-tokens: 1000  # 이 API의 출력 토큰 상한 (추론 토큰 포함). openai.max-output-tokens 대신 쓴다
  # 맞춤 정책 목록 (#225, #229). 값을 빼면 코드 기본값을 쓴다
  recommend:
    limit: 10              # 목록 건수 N
    rerank:
      # LLM 리랭킹: 규칙 후보(최대 candidate-limit건) 중 상위 모델(openai.model.premium)이 최종 N건을 고른다. 실패·시간 초과면 규칙 상위 N
      # false면 LLM을 호출하지 않는다. 서버에서는 .env의 POLICY_RECOMMEND_RERANK_ENABLED로 바꾸고, 재시작 없이 끄려면 관리자 API(PUT /api/admin/policy/recommend/rerank/enabled)
      enabled: ${POLICY_RECOMMEND_RERANK_ENABLED:true}
      candidate-limit: 50  # LLM에 보낼 후보 최대 건수 M
      timeout: 20s         # 캐시가 없을 때 목록 조회가 LLM을 기다리는 최대 시간
      max-output-tokens: 3000   # 추론 토큰 포함
      precompute-delay-ms: 1000 # 미리 계산 호출 사이 간격

# 테스트 전용 설정. src/main/resources/application.yml(.gitignore 대상)이 없는 CI에서도,
# 로컬에서 .env를 불러오지 않아도 ./gradlew test가 돌도록 한다.
# 실제 비밀값은 넣지 않는다. 외부 API·DB를 실제로 호출하는 테스트는 없다.
spring:
  datasource:
    url: jdbc:h2:mem:fintarget-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

kakao:
  client-id: test-kakao-client-id
  client-secret: test-kakao-client-secret
  redirect-uri: http://localhost:8080/login/oauth2/code/kakao

jwt:
  # HS256 키 길이(256비트 이상)를 만족하는 테스트 전용 값
  secret: test-jwt-secret-for-ci-only-0123456789abcdef0123456789abcdef
  expiration: 3600000

youthcenter:
  api:
    key: test-youthcenter-key
    base-url: http://localhost:0/youthcenter

kinfa:
  api:
    key: test-kinfa-key
    base-url: http://localhost:0/kinfa

# 앱 시작 시 외부 정책 API를 호출하는 초기 동기화와 스케줄러를 끈다
policy:
  sync:
    scheduler:
      enabled: false

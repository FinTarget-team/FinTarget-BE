# 테스트 전용 설정. src/main/resources/application.yml(.gitignore 대상)이 없는 CI에서도,
# 로컬에서 .env를 불러오지 않아도 ./gradlew test가 돌도록 한다.
# 실제 비밀값은 넣지 않는다. 외부 API·DB를 실제로 호출하는 테스트는 없다.
spring:
  datasource:
    url: jdbc:h2:mem:fintarget-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

kakao:
  # 비우면 카카오 토큰의 발급 앱을 확인하지 않는다 (확인 동작은 KakaoOAuthClientTest에서 검증)
  app-id: ""

jwt:
  # HS256 키 길이(256비트 이상)를 만족하는 테스트 전용 값
  secret: test-jwt-secret-for-ci-only-0123456789abcdef0123456789abcdef
  expiration: 3600000

youthcenter:
  api:
    key: test-youthcenter-key
    base-url: http://localhost:0/youthcenter

kinfa:
  api:
    key: test-kinfa-key
    base-url: http://localhost:0/kinfa

# 앱 시작 시 외부 정책 API를 호출하는 초기 동기화와 스케줄러를 끈다
policy:
  sync:
    scheduler:
      enabled: false

# /auth/** 요청 횟수 제한 (#218). 여러 테스트가 같은 IP(127.0.0.1)로 인증 API를 부르므로 기본은 끄고,
# 제한 동작은 SecurityEndpointsIntegrationTest에서 값을 지정해 확인한다
auth:
  rate-limit:
    requests-per-minute: 0
